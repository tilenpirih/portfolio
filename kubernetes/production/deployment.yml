apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: personal-tilen
  labels:
    app: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
        - name: portfolio
          image: registry.ventic.tv/personal/tilen/portfolio:1.0.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: '0.25'
            limits:
              memory: 512Mi
          env:
            # NUXT_PUBLIC_ prefix, not a bare BASE_URL: that is the only name Nuxt
            # reads at runtime to override runtimeConfig.public.BASE_URL. As a plain
            # BASE_URL it was silently ignored, leaving the value empty — which is
            # why canonical came out as "/" and og:image as a relative path.
            - name: NUXT_PUBLIC_BASE_URL
              value: https://tilenpirih.com
            - name: EMAILJS_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: emailjs-public-key
            - name: EMAILJS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: emailjs-private-key
            - name: EMAILJS_SERVICE_ID
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: emailjs-service-id
            - name: EMAILJS_TEMPLATE_ID
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: emailjs-template-id
